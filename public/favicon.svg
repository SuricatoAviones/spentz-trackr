<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Spentz Trackr">
  <!--
    Favicon autocontenido. La versión anterior era un <image href="/images/logo.png">
    y no se veía: los navegadores renderizan los SVG de favicon sin cargar recursos
    externos, así que tienen que ir dibujados aquí dentro.

    Solo la marca, sin el texto del lockup: a 16 px el wordmark es ilegible y roba
    todo el espacio. Fondo propio en vez de transparencia para que la marca se lea
    igual sobre pestañas claras y oscuras.
  -->
  <rect width="64" height="64" rx="14" fill="#0B1220"/>

  <!-- Anillo exterior partido en cuatro arcos (2πr ≈ 125.7 con r=20). -->
  <circle cx="32" cy="32" r="20"
          fill="none"
          stroke="#10B981"
          stroke-width="6"
          stroke-linecap="round"
          stroke-dasharray="23 8.4"
          transform="rotate(-45 32 32)"/>

  <!-- Núcleo. -->
  <rect x="26" y="26" width="12" height="12" rx="3.5" fill="#10B981"/>
</svg>
